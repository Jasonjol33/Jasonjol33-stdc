# Fly.io config for the Star Citizen showcase bot (incl. web page).
# The bot runs as a background process and serves the web page alongside it.
# After deploy the page is reachable at https://jasonjol33-stdc.fly.dev

app = "jasonjol33-stdc"
primary_region = "fra"

[build]

[[mounts]]
  source = "sc_showcase_data"
  destination = "/app/data"

[env]
  DATA_DIR = "/app/data"
  PORT = "8080"
  WEB_URL = "https://jasonjol33-stdc.fly.dev"

# IMPORTANT: the bot must run permanently and on ONE machine only
# (otherwise it posts twice). Keep both values on false, do not scale up.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false

  # Liveness-Check: 200 = Webserver lebt (Details zu den Daten stehen im JSON-Body).
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
