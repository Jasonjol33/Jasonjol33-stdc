# fly.toml app configuration file generated for jasonjol33-stdc on 2026-10-10T15:52:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jasonjol33-stdc'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/app/data'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
